<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060B" />
    <title>ExpenseFlow — Offline</title>
    <style>
      :root {
        --bg-base: #05060b;
        --bg-surface: rgba(255, 255, 255, 0.04);
        --text-primary: rgba(255, 255, 255, 0.92);
        --text-secondary: rgba(255, 255, 255, 0.62);
        --border-subtle: rgba(255, 255, 255, 0.12);
        --mint: #63e4b5;
        --mint-soft: rgba(99, 228, 181, 0.12);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(
            1200px 600px at 20% 10%,
            rgba(99, 228, 181, 0.12),
            transparent 50%
          ),
          radial-gradient(
            1000px 600px at 90% 30%,
            rgba(255, 179, 71, 0.08),
            transparent 55%
          ),
          var(--bg-base);
        color: var(--text-primary);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
      }

      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        font-size: 18px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--mint);
        box-shadow: 0 0 0 6px var(--mint-soft);
      }

      .sub {
        margin: 0 0 18px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border-subtle);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }

      .btn.primary {
        border-color: rgba(99, 228, 181, 0.35);
        background: rgba(99, 228, 181, 0.10);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 class="title"><span class="dot"></span> You’re offline</h1>
        <p class="sub">
          Your data will sync when you’re back online. You can still browse recently opened pages and cached data.
        </p>
        <div class="actions">
          <button class="btn primary" onclick="location.reload()">Try again</button>
          <button class="btn" onclick="location.href='/'">Go to dashboard</button>
        </div>
      </div>
    </div>
  </body>
</html>
